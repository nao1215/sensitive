version: "2"
run:
  # The language version go.mod declares. The linter assumes this when it
  # decides what the code may use, so a higher number here would let a construct
  # that does not compile on the supported floor through the gate.
  go: "1.22"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gomoddirectives
    - gosec
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - sloglint
    - staticcheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errcheck:
      disable-default-exclusions: false
      check-type-assertions: true
      check-blank: true
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: .*_test\.go
      # G101 reports hardcoded credentials. This library's tests are made of
      # them: a detector for AWS keys and Stripe tokens is tested by handing it
      # AWS keys and Stripe tokens, and the published documentation examples show
      # the same. The strings are the well-known non-secrets from each vendor's
      # own docs (AKIAIOSFODNN7EXAMPLE, sk_live_4eC39Hq...), and there is nothing
      # they could leak. In non-test code G101 stays on.
      - linters:
          - gosec
        path: .*_test\.go
        text: G101
      - linters:
          - errcheck
        source: defer
      - path: (.+)\.go$
        text: fmt.Fprintf
      - path: (.+)\.go$
        text: fmt.Fprintln
      - path: (.+)\.go$
        text: fmt.Fprint
      - path: (.+)\.go$
        text: fmt.Printf
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
