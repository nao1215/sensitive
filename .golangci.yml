version: '2'
run:
  go: '1.26'
  timeout: 10m
  tests: true
  relative-path-mode: gomod
linters:
  default: none
  enable:
  - asasalint
  - asciicheck
  - bidichk
  - bodyclose
  - canonicalheader
  - containedctx
  - contextcheck
  - copyloopvar
  - decorder
  - depguard
  - dogsled
  - dupl
  - dupword
  - durationcheck
  - embeddedstructfieldcheck
  - errcheck
  - errchkjson
  - errname
  - errorlint
  - exhaustive
  - exhaustruct_v5
  - exptostd
  - fatcontext
  - forbidigo
  - forcetypeassert
  - gocheckcompilerdirectives
  - gochecknoglobals
  - gochecknoinits
  - gocognit
  - goconst
  - gocritic
  - gocyclo
  - funlen
  - cyclop
  - maintidx
  - godot
  - gomoddirectives
  - gosec
  - govet
  - iface
  - ineffassign
  - interfacebloat
  - intrange
  - makezero
  - mirror
  - misspell
  - mnd
  - modernize
  - musttag
  - nakedret
  - nestif
  - nilerr
  - nilnesserr
  - nilnil
  - noctx
  - nolintlint
  - nosprintfhostport
  - paralleltest
  - perfsprint
  - prealloc
  - predeclared
  - reassign
  - recvcheck
  - revive
  - rowserrcheck
  - sloglint
  - sqlclosecheck
  - staticcheck
  - tagliatelle
  - testableexamples
  - testifylint
  - thelper
  - tparallel
  - unconvert
  - unparam
  - unused
  - usestdlibvars
  - usetesting
  - wastedassign
  - whitespace
  settings:
    depguard:
      rules:
        root-production:
          list-mode: strict
          files:
          - $all
          - '!$test'
          - '!**/embargotest/**'
          - '!**/tests/**'
          - '!**/adapters/**'
          - '!**/internal/output/**'
          - '!**/cmd/**'
          allow:
          - $gostd
          - github.com/nao1215/embargo/internal/
          deny:
          - pkg: testing$
            desc: Runtime packages must not depend on testing.
          - pkg: testing/
            desc: Runtime packages must not depend on testing helpers.
        commands:
          list-mode: strict
          files:
          - '**/cmd/embargo/*.go'
          - '!$test'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
        logger-output:
          list-mode: strict
          files:
          - '**/internal/output/*.go'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
          - github.com/nao1215/embargo/internal/saferecord$
        detectors:
          list-mode: strict
          files:
          - '**/internal/detect/**/*.go'
          - '!$test'
          allow:
          - $gostd
          - github.com/nao1215/embargo/internal/ascii$
        ascii:
          list-mode: strict
          files:
          - '**/internal/ascii/*.go'
          - '!$test'
          allow:
          - $gostd
        recorder:
          list-mode: strict
          files:
          - '**/embargotest/*.go'
          - '!$test'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
        root-tests:
          list-mode: strict
          files:
          - $test
          - '!**/tests/**'
          - '!**/adapters/**'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
          - github.com/nao1215/embargo/internal/
          - github.com/nao1215/embargo/embargotest$
        logger-adapters:
          list-mode: strict
          files:
          - '**/adapters/**/*.go'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
          - github.com/nao1215/embargo/internal/output$
          - github.com/nao1215/embargo/internal/saferecord$
          - github.com/nao1215/embargo/embargotest$
          - github.com/nao1215/embargo/adapters/
          - go.uber.org/zap
          - github.com/rs/zerolog$
          - github.com/sirupsen/logrus$
          - google.golang.org/grpc
          - go.opentelemetry.io/otel
          - github.com/getsentry/sentry-go$
        sdk-tests:
          list-mode: strict
          files:
          - '**/tests/**/*.go'
          allow:
          - $gostd
          - github.com/nao1215/embargo$
          - github.com/nao1215/embargo/embargotest$
          - github.com/nao1215/embargo/tests/
          - pgregory.net/rapid$
          - go.uber.org/goleak$
          - go.uber.org/zap
          - github.com/rs/zerolog
          - github.com/sirupsen/logrus$
          - google.golang.org/grpc
          - go.opentelemetry.io/otel
          - github.com/getsentry/sentry-go
          - github.com/m-mizutani/masq$
          - github.com/icntswm/go-masker
          - github.com/samber/slog-formatter$
          - github.com/showa-93/go-mask$
          - github.com/bytedance/godlp
          - golang.org/x/crypto/
          - golang.org/x/tools/go/
          - go/types$
          - go/token$
          - go/constant$
          - go/ast$
          - go/parser$
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
      exclude-functions: []
    errchkjson:
      check-error-free-encoding: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # Lowest threshold with no duplicate in any module when it was set; below it
    # the matches are explicit table-test cases.
    dupl:
      threshold: 100
    # Production limits; test functions keep the earlier 30 and 25 through the
    # exclusion rules below, since table cases read best kept together.
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 15
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    # The lowest production index measured when these limits were set was 37.
    maintidx:
      under: 35
    nestif:
      min-complexity: 5
    goconst:
      ignore-tests: false
    exhaustive:
      default-signifies-exhaustive: false
    exhaustruct_v5:
      explicit-mode: true
      enforce-patterns:
      - github.com/nao1215/embargo/embargotest\.Recorder
      - github.com/nao1215/embargo\.slogHandler
    forbidigo:
      analyze-types: true
      forbid:
      - pattern: ^fmt\.Print(f|ln)?$
        msg: Use an injected writer; Examples need a local, justified suppression.
      - pattern: ^os\.(Chdir|Setenv|Unsetenv|Clearenv)$
        msg: Do not mutate process-global state; configure the child or use testing helpers.
      - pattern: ^math/rand(/v2)?\.
        msg: Use explicit fixtures or rapid generators, not uncontrolled randomness.
      - pattern: ^time\.Sleep$
        msg: Synchronize with channels or a bounded context.
    gocritic:
      enabled-tags:
      - diagnostic
      - style
      - performance
      disabled-checks: []
    gosec:
      excludes: []
    govet:
      enable-all: true
    modernize:
      disable: []
    perfsprint:
      concat-loop: true
    recvcheck:
      disable-builtin: true
      exclusions:
      - Input.UnmarshalJSON
      - Input.UnmarshalText
      - Input.Scan
    revive:
      enable-default-rules: true
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: superfluous-else
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: unused-parameter
      - name: var-declaration
      - name: var-naming
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
        use-field-name: true
    gomoddirectives:
      replace-local: true
      replace-allow-list:
      - github.com/nao1215/embargo
      - github.com/nao1215/embargo/adapters/zap
  exclusions:
    generated: disable
    presets: []
    # Output assertions exercise demonstration printing. Only fmt output calls in
    # Example functions may ignore errors; tests/contracts/policy_test.go
    # enforces the function boundary inside these files (including closures).
    rules:
    - path: '(^|/)([a-z_]+_)?example(_[a-z_]+)?_test\.go$'
      linters: [errcheck]
      text: 'Error return value of .fmt\.(Print|Fprint)(f|ln)?. is not checked'
    - path: '(^|/)([a-z_]+_)?example(_[a-z_]+)?_test\.go$'
      linters: [forbidigo]
      text: 'use of `fmt\.Print(f|ln)?`'
    # Tests are held to the earlier complexity ceilings: gocognit 30, gocyclo 25.
    - path: '_test\.go$'
      linters: [gocognit]
      text: 'cognitive complexity (1[6-9]|2[0-9]|30) of func'
    - path: '_test\.go$'
      linters: [gocyclo]
      text: 'cyclomatic complexity (1[6-9]|2[0-5]) of func'
    - path: '_test\.go$'
      linters: [funlen, cyclop, maintidx]
    paths: []
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
      - github.com/nao1215/embargo
  exclusions:
    generated: disable
    paths: []
