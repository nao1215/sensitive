<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="398" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="20" width="720" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="36" y="42" text-anchor="start" fill="#1f2328" font-size="14">CI gates</text>
<text x="36" y="60" text-anchor="start" fill="#57606a" font-size="12">coverage 97% and diff coverage, mutation floors, paired benchmarks, accuracy and real-log ceilings</text>
<rect x="20" y="78" width="720" height="50" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="36" y="100" text-anchor="start" fill="#1f2328" font-size="14">Real output</text>
<text x="36" y="118" text-anchor="start" fill="#57606a" font-size="12">zap, zerolog, logrus, gRPC, OpenTelemetry and Sentry SDKs; checksum-pinned public logs</text>
<rect x="20" y="136" width="720" height="50" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="36" y="158" text-anchor="start" fill="#1f2328" font-size="14">Command E2E</text>
<text x="36" y="176" text-anchor="start" fill="#57606a" font-size="12">atago specs run the built binary: pipes, files, run, exit codes, Windows</text>
<rect x="20" y="194" width="720" height="50" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="36" y="216" text-anchor="start" fill="#1f2328" font-size="14">Oracles and models</text>
<text x="36" y="234" text-anchor="start" fill="#57606a" font-size="12">independent Python and gitleaks oracles, Lean checksum proofs, Quint lifecycle model</text>
<rect x="20" y="252" width="720" height="50" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="36" y="274" text-anchor="start" fill="#1f2328" font-size="14">Generated inputs</text>
<text x="36" y="292" text-anchor="start" fill="#57606a" font-size="12">properties, metamorphic relations, structure-aware fuzzing, mutation testing</text>
<rect x="20" y="310" width="720" height="50" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="36" y="332" text-anchor="start" fill="#1f2328" font-size="14">Examples and unit tests</text>
<text x="36" y="350" text-anchor="start" fill="#57606a" font-size="12">every public symbol has a runnable Example; one test file per source file</text>
<text x="20" y="382" text-anchor="start" fill="#57606a" font-size="12">Lower layers are fast and run on every change; upper layers run the real binary, SDKs and data.</text>
</svg>
