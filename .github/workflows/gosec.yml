name: Gosec
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ['.', tests, adapters/zap, adapters/zerolog, adapters/logrus]
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: securego/gosec@14c713478ed40c9bdfa56d35d9c2142b91608106 # v2.30.0 post-release action image fix
        with:
          args: '-tests ${{ matrix.module }}/...'
