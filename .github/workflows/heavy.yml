name: Heavy verification
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
env:
  GOMAXPROCS: '4'
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - run: make mutation > mutation.txt 2>&1
      - run: python3 scripts/mutation_attribution.py --output attribution.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-evidence
          path: |
            mutation.txt
            mutation-results/
            attribution.json
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test . -run '^TestAdversarial' -bench '^BenchmarkAdversarialScaling$' -benchtime=1x -count=3 -benchmem > scaling.txt
      - run: |
          go test . -run '^TestHookAllocationBudget$' -bench '^BenchmarkHookScaling$' -benchtime=1x -count=3 -benchmem >> scaling.txt
          for module in grpc otel sentry; do
            go -C adapters/$module test -run '^TestHookAllocationBudget$' -bench '^BenchmarkHookScaling$' -benchtime=1x -count=3 -benchmem >> scaling.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: adversarial-scaling
          path: scaling.txt
