name: licenses

# Dependency license gate. Every module linked into the root module, the
# embargo command or an adapter must carry a license that go-licenses can
# identify, and that license must not be copyleft that reaches a statically
# linked Go binary (GPL, LGPL) or forbidden outright (AGPL, non-commercial
# Creative Commons, Commons Clause). The tests module is not shipped and is
# not checked.
#
# github.com/nao1215/embargo is ignored by prefix: it covers this repository's
# own modules, which are MIT (LICENSE at the repository root). go-licenses
# reports them as unknown because an adapter directory has no LICENSE file of
# its own; pkg.go.dev and the module zips take the root LICENSE.
#
# The check runs per GOOS because the set of linked packages differs by
# target. There is no schedule: go.sum pins every version, so the verdict only
# changes when a pull request changes the dependencies.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOMAXPROCS: '4'
permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: licenses (${{ matrix.module }}, ${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module: [., adapters/grpc, adapters/logrus, adapters/otel, adapters/sentry, adapters/zap, adapters/zerolog]
        goos: [linux, windows, darwin]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # Pinned so a classifier update cannot change the verdict on its own.
      # Installed before GOOS is set: the tool itself runs on the runner.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      # GOROOT is set explicitly because go-licenses recognizes the standard
      # library by path prefix; after a toolchain switch it would otherwise
      # report every standard library package as lacking module information.
      - name: Check dependency licenses
        working-directory: ${{ matrix.module }}
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: |
          GOROOT="$(go env GOROOT)"
          export GOROOT
          go-licenses check --disallowed_types=forbidden,restricted,unknown --ignore github.com/nao1215/embargo ./...
