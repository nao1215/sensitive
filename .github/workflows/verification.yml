name: Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_base:
        description: Base commit for a manual paired comparison
        required: false
        default: origin/main
env:
  GOMAXPROCS: '4'
  LEAN_NUM_THREADS: '4'
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/case_docs.py --check
      - run: python3 scripts/quality_docs.py --check
      - run: go -C tests run ./cmd/detectordocs --check
      - run: go -C tests test ./cmd/detectordocs -count=1
      - run: python3 scripts/check_prose.py
      - run: python3 scripts/check_policies.py
      - run: python3 scripts/mutation_gate.py --check-evidence
      - run: python3 scripts/testing_techniques.py --check
      - name: Verify workflow lockfile and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          python3 scripts/lock_actions.py --check
          gh actions-lock --verify
      - name: Replay models, vectors and external oracles
        run: |
          go test . -run '^TestDispatchDifferential$' -count=1
          go test ./embargotest -run '^TestQuint' -count=1
          go -C tests test . -run '^(TestQuint|TestLeanReference|TestExternal|TestStandardLibrary)' -count=1
  formal:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.quint
          key: quint-0.33.1-apalache-0.62.4-linux-x64
      - name: Verify models and regenerate bounded traces
        env:
          JAVA_TOOL_OPTIONS: '-Xmx768m -XX:ActiveProcessorCount=4'
        run: |
          npm ci --prefix tests/models --ignore-scripts
          python3 scripts/install_quint_evaluator.py
          python3 scripts/quint_models.py --check
      - name: Check proofs and compiled reference vectors
        run: |
          python3 scripts/install_verification.py "$RUNNER_TEMP/embargo-formal" >> "$GITHUB_PATH"
      - run: python3 scripts/check_lean.py
      - name: Replay freshly verified model traces
        run: |
          go test ./embargotest -run '^TestQuint' -count=1
          go -C tests test . -run '^TestQuint' -count=1
  benchmark:
    needs: changes
    if: needs.changes.outputs.detectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - name: Compare base and head on this runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.benchmark_base || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_benchmark.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: paired-benchmark
          path: benchmark-results/
  accuracy:
    needs: changes
    if: needs.changes.outputs.detectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - run: python3 scripts/quality_gate.py accuracy
  false_positives:
    needs: changes
    if: needs.changes.outputs.detectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/embargo-real-logs
          key: real-logs-${{ hashFiles('doc/real-logs-manifest.json') }}
      - name: Enforce per-Kind sampled false-positive ceilings
        run: python3 scripts/quality_gate.py false-positives --cache "$RUNNER_TEMP/embargo-real-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quality-false-positives
          path: quality-results/

  detection_compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/embargo-real-logs
          key: real-logs-${{ hashFiles('doc/real-logs-manifest.json') }}
      - name: Check detection compatibility and release notes
        run: python3 scripts/detection_changes.py --cache "$RUNNER_TEMP/embargo-real-logs"
