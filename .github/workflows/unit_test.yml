name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  unit_test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # Minimum patched runtime and newest stable on every supported runner.
        go: ["1.26.11", "stable"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Test optional logger modules
        shell: bash
        run: |
          for module in zap zerolog logrus; do
            go -C adapters/$module mod tidy -diff
            go -C adapters/$module test -race ./...
          done

  cross_build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cross build (${{ matrix.goos }})

    # The matrix above runs on the three operating systems GitHub hosts runners
    # for. This is the cheap other half: whether the module compiles for the
    # BSDs at all. A library is reached by `go get` from whatever machine its
    # caller has, so a build that stops working on FreeBSD surfaces in their
    # terminal rather than here unless something watches it. A leg takes seconds
    # and produces no binary.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, openbsd, netbsd]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build
        run: go build ./...

  property_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Property tests (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The tests module shares the library minimum.
        go: ["1.26.11", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: tests/go.sum
      - name: Check deterministic synthetic corpus
        run: python3 scripts/generate_accuracy.py --check
      - name: Check root module isolation
        shell: bash
        run: |
          go mod tidy -diff
          test "$(go list -m all)" = github.com/nao1215/embargo
      - name: Check test module and run properties
        shell: bash
        working-directory: tests
        run: |
          go mod tidy -diff
          go test ./...

  documentation:
    name: README and runnable Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/go.sum
      - name: Check README snippets and run Examples
        run: go test ./... -run '^(Example|TestReadme|TestExamples|TestPublicExamples)'
      - name: Run adapter Examples
        run: |
          for module in zap zerolog logrus; do
            go -C adapters/$module test -run '^Example' ./...
          done
      - name: Check generated documentation
        # The impossible subtest pattern checks the compatibility table itself
        # without running the SDK, HTTP or child-process compatibility suites.
        run: go -C tests test . -run '^(TestAccuracyTable|TestBenchmarkTable|TestTestingMetrics|TestCompatibilityTable)$/^$'
      - name: Check documentation tools and change classification
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
