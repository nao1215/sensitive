name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # The floor go.mod declares and the newest release. The floor is 1.22
        # because the detectors use range-over-int, which 1.21 rejects; nothing
        # in the tree needs anything newer, and this matrix is the only place
        # that claim is checked. "stable" tracks each Go release without an
        # edit, and is used rather than "1" because setup-go resolves "1" from
        # its own manifest, which lags a fresh release.
        go:
          - "1.22"
          - "stable"
        # Go 1.22 binaries do not run on the current macOS runner image: its
        # linker omits the LC_UUID load command that modern dyld requires, so
        # every test binary aborts with "missing LC_UUID load command" before a
        # single test runs. That is a toolchain-and-OS limit, not something this
        # library can fix or should raise its floor for -- a macOS user on an
        # older system builds fine. The floor stays verified on Linux and
        # Windows, and macOS still runs the newest Go.
        exclude:
          - os: "macos-latest"
            go: "1.22"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...
