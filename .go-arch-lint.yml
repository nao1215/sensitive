version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true
exclude:
- tests
- adapters
- embargotest/testdata
excludeFiles:
- ^.*_test\.go$
components:
  output:
    in: internal/output
  recorder:
    in: embargotest
  runtime:
    in: .
  detectors:
    in: internal/detect/**
  ascii:
    in: internal/ascii
deps:
  output:
    mayDependOn:
    - runtime
  recorder:
    mayDependOn:
    - runtime
  runtime:
    mayDependOn:
    - detectors
    - ascii
  detectors:
    mayDependOn:
    - ascii
