# gitleaks configuration. The default rules apply everywhere except the paths
# below, which hold synthetic credentials that embargo's detectors are tested
# and measured against. A real secret in library code, scripts, workflows or
# prose documentation still fails the scan.

[extend]
useDefault = true

# The singular table: gitleaks-action installs gitleaks 8.24, which does not
# read the newer [[allowlists]] array.
[allowlist]
description = "Synthetic credentials used as detector test inputs and measurement records"
paths = [
  '''(^|/)[^/]+_test\.go$''',
  '''(^|/)testdata/''',
  '''^tests/''',
  '''^doc/performance/mutation-baseline\.json$''',
  '''^doc/quality-gates\.json$''',
]
