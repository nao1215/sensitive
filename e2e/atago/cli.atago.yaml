# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/v0.26.0/schema/atago.schema.json
# Black-box behaviour of the embargo command: the pipe filter, file input,
# --format json and jsonl, a CI gate, exit codes and option errors. scripts/run_e2e.sh builds
# the command from this checkout and puts it first on PATH.
# The first scenario pins the command output shown in the README.
version: "1"

suite:
  name: embargo command

scenarios:
  - name: README example masks a text line and a JSON line
    steps:
      - run:
          command: embargo
          stdin: |
            login failed for alice@example.com from 203.0.113.7
            {"user":"alice@example.com","password":"hunter2","card":"4111111111111111","attempts":3}
      - assert:
          exit_code: 0
          stdout:
            equals: |
              login failed for [REDACTED] from [REDACTED]
              {"user":"[REDACTED]","password":"[REDACTED]","card":"[REDACTED]","attempts":3}
          stderr:
            empty: true

  - name: line endings and a missing final newline are kept
    steps:
      - run:
          command: embargo
          stdin: "card=4111111111111111\r\nplain\nlast 4111111111111111"
      - assert:
          exit_code: 0
          stdout:
            equals: "card=[REDACTED]\r\nplain\nlast [REDACTED]"

  - name: a private key block masks every line until its END line
    steps:
      - run:
          command: embargo
          stdin: |
            loading key
            -----BEGIN PRIVATE KEY-----
            MIIEvQIBADANBgkqhkiG9w0BAQEFAASC
            YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4
            loaded for alice@example.com
      - assert:
          exit_code: 0
          stdout:
            equals: |
              loading key
              [REDACTED]
              [REDACTED]
              [REDACTED]
              [REDACTED]

  - name: files are read in order like cat
    steps:
      - fixture:
          file: first.log
          content: |
            first alice@example.com
      - fixture:
          file: second.log
          content: |
            second 4111111111111111
      - run:
          command: embargo first.log second.log
      - assert:
          exit_code: 0
          stdout:
            equals: |
              first [REDACTED]
              second [REDACTED]

  - name: --kinds narrows the detectors
    steps:
      - run:
          command: embargo --kinds pan
          stdin: |
            alice@example.com 4111111111111111
      - assert:
          exit_code: 0
          stdout:
            equals: |
              alice@example.com [REDACTED]

  - name: --format json prints counts and locations without input bytes
    steps:
      - run:
          command: embargo --format json --samples 1
          stdin: |
            card=4111111111111111
            card=4111111111111111
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"kind": "pan"'
              - '"count": 2'
              - '"drop_option": "Pass --kinds with the kinds you need, leaving out pan."'
              - '"start": 5'
              - '"lines": 2'
            not_contains: "4111111111111111"

  - name: --format json reads files and --kinds all adds the opt-in kinds
    steps:
      - fixture:
          file: app.log
          content: |
            ssn 123-45-6789
            card 4111111111111111
      - run:
          command: embargo --format json app.log
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"kind": "pan"'
              - '"lines": 2'
            not_contains: '"kind": "us_ssn"'
      - run:
          command: embargo --kinds all app.log
      - assert:
          exit_code: 0
          stdout:
            equals: |
              ssn [REDACTED]
              card [REDACTED]
      - run:
          command: embargo --format json --kinds all app.log
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"kind": "us_ssn"'
              - '"kind": "pan"'

  - name: a file named - reads stdin and flags after files are rejected
    steps:
      - fixture:
          file: app.log
          content: |
            file alice@example.com
      - run:
          command: embargo app.log - app.log
          stdin: |
            stdin 4111111111111111
      - assert:
          exit_code: 0
          stdout:
            equals: |
              file [REDACTED]
              stdin [REDACTED]
              file [REDACTED]
      - run:
          command: embargo app.log --kinds email
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            equals: |
              embargo: flags must come before the files; see embargo --help

  - name: --format jsonl prints one location per finding and nothing for clean input
    steps:
      - fixture:
          file: app.log
          content: |
            clean
            card=4111111111111111 mail alice@example.com
      - run:
          command: embargo --format jsonl app.log
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"kind":"pan","start":11,"end":27,"line":2,"column":5}
              {"kind":"email","start":33,"end":50,"line":2,"column":27}
      - run:
          command: embargo --format jsonl
          stdin: |
            nothing sensitive here
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: a CI step fails when a log holds a secret or cannot be read
    steps:
      - fixture:
          file: leaky.log
          content: |
            password=hunter2
      - fixture:
          file: clean.log
          content: |
            request served in 12 ms
      - run:
          command: sh -c 'out=$(embargo --format jsonl leaky.log) && test -z "$out"'
      - assert:
          exit_code: 1
      - run:
          command: sh -c 'out=$(embargo --format jsonl clean.log) && test -z "$out"'
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'out=$(embargo --format jsonl missing.log) && test -z "$out"'
      - assert:
          exit_code: 1

  - name: the commands in doc/audit.md run as written
    steps:
      - fixture:
          file: app.log
          content: |
            card=4111111111111111 password=hunter2
      - run:
          command: embargo --kinds pan,credential app.log
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'embargo --format json < app.log'
      - assert:
          exit_code: 0
      - run:
          command: embargo --format json --kinds all app.log
      - assert:
          exit_code: 0
      - run:
          command: embargo --format json --kinds pan,credential --min-confidence 0.7 app.log
      - assert:
          exit_code: 0
      - run:
          command: embargo --format jsonl app.log
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'out=$(embargo --format jsonl app.log) && test -z "$out"'
      - assert:
          exit_code: 1
      - run:
          command: sh -c 'embargo --format json --kinds pan,email app.log > before.json'
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'embargo --format json --kinds pan,credential --min-confidence 0.7 app.log > after.json'
      - assert:
          exit_code: 0

  - name: a missing file fails without repeating its name
    steps:
      - run:
          command: embargo private-name.log
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            equals: |
              embargo: an input file cannot be opened

  - name: option errors name the flag and never echo the value
    steps:
      - run:
          command: embargo --min-confidence password=hunter2
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            equals: |
              embargo: --min-confidence must be a number from 0 to 1
      - run:
          command: embargo --kinds password=hunter2
      - assert:
          exit_code: 1
          stderr:
            equals: |
              embargo: --kinds must be all or a comma-separated list of kinds; see embargo --help
      - run:
          command: embargo --samples 2
      - assert:
          exit_code: 1
          stderr:
            equals: |
              embargo: --samples requires --format json
      - run:
          command: embargo --format yaml
      - assert:
          exit_code: 1
          stderr:
            equals: |
              embargo: --format must be text, json or jsonl
      - run:
          command: embargo --password=hunter2
      - assert:
          exit_code: 1
          stderr:
            equals: |
              embargo: unknown flag or missing flag value; see embargo --help

  - name: help and version exit successfully
    steps:
      - run:
          command: embargo --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Usage: embargo [--format text|json|jsonl]"
              - "--format F"
      - run:
          command: embargo --version
      - assert:
          exit_code: 0
          stdout:
            contains: "embargo "
