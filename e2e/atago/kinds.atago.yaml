# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/v0.26.0/schema/atago.schema.json
# One labeled sample per Kind from tests/testdata, masked where its label says.
# The expected text comes from the label, not from running embargo.
version: "1"

suite:
  name: embargo kinds

scenarios:
  - name: "--kinds ${kind} masks a labeled ${kind} value"
    matrix:
      - kind: "aba_routing"
        input: "021000021"
        want: "[REDACTED]"
      - kind: "ach_trace"
        input: "ACH trace 021000021123456"
        want: "ACH trace [REDACTED]"
      - kind: "awskey"
        input: "AKIAIOSFODNN7EXAMPLE"
        want: "[REDACTED]"
      - kind: "bank_account"
        input: "bank account 12345678"
        want: "bank account [REDACTED]"
      - kind: "br_cnpj"
        input: "identity=40771605520366; result=ok"
        want: "identity=[REDACTED]; result=ok"
      - kind: "br_cpf"
        input: "identity=86017494961; result=ok"
        want: "identity=[REDACTED]; result=ok"
      - kind: "btc"
        input: "1111111111111111111114oLvT2"
        want: "[REDACTED]"
      - kind: "ca_sin"
        input: "identity=413-643-081; result=ok"
        want: "identity=[REDACTED]; result=ok"
      - kind: "card_expiry"
        input: "expiry 12/28"
        want: "expiry [REDACTED]"
      - kind: "cn_resident_id"
        input: "identity=510104199602017742; result=ok"
        want: "identity=[REDACTED]; result=ok"
      - kind: "credential"
        input: "authorization: SAOyi6uBAy8PWdRSCzqNgiVNndC9IiQzJr9AVs26"
        want: "authorization: [REDACTED]"
      - kind: "cvv"
        input: "CVV: 123"
        want: "CVV: [REDACTED]"
      - kind: "email"
        input: "alice@example.com"
        want: "[REDACTED]"
      - kind: "eth"
