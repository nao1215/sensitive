# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # Review the generators, assertions and summaries instead of their bulk output.
  # CI checks the generated corpus and figures against the source data.
  path_filters:
    - "!tests/testdata/accuracy_generated.jsonl"
    - "!tests/testdata/accuracy_generated_controls.jsonl"
    - "!tests/testdata/accuracy_held_generated.jsonl"
    - "!tests/testdata/accuracy_held_generated_controls.jsonl"
    - "!tests/testdata/credentials-development.jsonl"
    - "!tests/testdata/credentials-held.jsonl"
    - "!doc/benchmarks.raw.txt"
    - "!doc/performance/*.txt"
    - "!tests/lean/vectors.tsv"
    - "!tests/models/input.json"
    - "!tests/models/recorder.json"
    - "!tests/models/guard.json"
