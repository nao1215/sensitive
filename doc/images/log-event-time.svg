<text x="24" y="134" font-size="15" fill="#172033" text-anchor="start">slog alone</text>
<rect x="240" y="113" width="71.35" height="28" rx="2" fill="#617281"/>
<text x="321.35" y="134" font-size="14" fill="#172033" text-anchor="start">0.88 µs</text>
<text x="24" y="176" font-size="15" fill="#172033" text-anchor="start">slog + embargo</text>
<rect x="240" y="155" width="376.03" height="28" rx="2" fill="#087f75"/>
