<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img">
<title>Time per JSON slog event</title><desc>Four labeled bars on the same linear microsecond axis. Lower is faster. Identical request message, email and card attributes; encoding and masking included.</desc>
