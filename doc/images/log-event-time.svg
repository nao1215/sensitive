<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="449" viewBox="0 0 1000 449" role="img">
<title>Time per JSON slog event</title><desc>Six labeled bars on the same linear microsecond axis. Lower is faster. Identical request message, email and card attributes; encoding and masking included.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="15" fill="#172033">
<text x="24" y="34" font-size="25" fill="#172033" text-anchor="start">Time per log event</text>
<text x="24" y="60" font-size="16" fill="#172033" text-anchor="start">Same JSON slog event: request + email + card. Lower is faster.</text>
<text x="24" y="84" font-size="12" fill="#172033" text-anchor="start">2026-11-19 · AMD RYZEN AI MAX+ 395 w/ Radeon 8060S · one CPU thread</text>
<rect x="240" y="105" width="1.00" height="258" rx="2" fill="#ccd2da"/>
<text x="240.0" y="386" font-size="13" fill="#172033" text-anchor="middle">0</text>
<rect x="402" y="105" width="1.00" height="258" rx="2" fill="#ccd2da"/>
<text x="402.5" y="386" font-size="13" fill="#172033" text-anchor="middle">1.5</text>
<rect x="565" y="105" width="1.00" height="258" rx="2" fill="#ccd2da"/>
<text x="565.0" y="386" font-size="13" fill="#172033" text-anchor="middle">3</text>
<rect x="728" y="105" width="1.00" height="258" rx="2" fill="#ccd2da"/>
<text x="727.5" y="386" font-size="13" fill="#172033" text-anchor="middle">4.5</text>
<rect x="890" y="105" width="1.00" height="258" rx="2" fill="#ccd2da"/>
<text x="890.0" y="386" font-size="13" fill="#172033" text-anchor="middle">6</text>
<text x="24" y="134" font-size="15" fill="#172033" text-anchor="start">slog alone</text>
<rect x="240" y="113" width="43.16" height="28" rx="2" fill="#617281"/>
<text x="293.16" y="134" font-size="14" fill="#172033" text-anchor="start">0.40 µs</text>
<text x="24" y="176" font-size="15" fill="#172033" text-anchor="start">slog + embargo (email, card)</text>
<rect x="240" y="155" width="137.58" height="28" rx="2" fill="#087f75"/>
<text x="387.58" y="176" font-size="14" fill="#172033" text-anchor="start">1.27 µs</text>
<text x="24" y="218" font-size="15" fill="#172033" text-anchor="start">slog + embargo (default)</text>
<rect x="240" y="197" width="182.65" height="28" rx="2" fill="#0b5f58"/>
<text x="432.65" y="218" font-size="14" fill="#172033" text-anchor="start">1.69 µs</text>
<text x="24" y="260" font-size="15" fill="#172033" text-anchor="start">slog + pii-shield v3.0.0</text>
<rect x="240" y="239" width="506.89" height="28" rx="2" fill="#8a6d00"/>
<text x="756.89" y="260" font-size="14" fill="#172033" text-anchor="start">4.68 µs</text>
<text x="24" y="302" font-size="15" fill="#172033" text-anchor="start">slog + masq v0.2.3</text>
<rect x="240" y="281" width="337.73" height="28" rx="2" fill="#4169b1"/>
<text x="587.73" y="302" font-size="14" fill="#172033" text-anchor="start">3.12 µs</text>
<text x="24" y="344" font-size="15" fill="#172033" text-anchor="start">slog + go-masker v0.6.1</text>
<rect x="240" y="323" width="151.45" height="28" rx="2" fill="#9a4814"/>
<text x="401.45" y="344" font-size="14" fill="#172033" text-anchor="start">1.40 µs</text>
<text x="565.0" y="412" font-size="15" fill="#172033" text-anchor="middle">Time per event (microseconds; linear scale)</text>
<text x="24" y="436" font-size="12" fill="#172033" text-anchor="start">Median of ten 200 ms samples; JSON to io.Discard; setup excluded. masq and go-masker get email and card rules, pii-shield its default policy.</text>
</g></svg>
