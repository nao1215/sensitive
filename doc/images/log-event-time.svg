<text x="24" y="60" font-size="16" fill="#172033" text-anchor="start">Same JSON slog event: request + email + card. Lower is faster.</text>
<text x="24" y="84" font-size="12" fill="#172033" text-anchor="start">2026-11-16 · AMD RYZEN AI MAX+ 395 w/ Radeon 8060S · one CPU thread</text>
