<path d="M727.5,105 L727.5,279" stroke="#e1e5ec"/>
<text x="727.5" y="302" font-size="13" fill="#172033" text-anchor="middle">6</text>
<path d="M890.0,105 L890.0,279" stroke="#e1e5ec"/>
