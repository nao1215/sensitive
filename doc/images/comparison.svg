<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img">
<title>JSON slog time by event</title><desc>Identical events through plain slog, embargo, masq and go-masker; median microseconds per event on one linear axis. Lower is faster.</desc>
